<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 120" role="img" aria-labelledby="sinfonia-title sinfonia-description">
  <title id="sinfonia-title">SINFONiA</title>
  <desc id="sinfonia-description">The SINFONiA wordmark with gray, red, yellow, and blue lettering.</desc>

  <style>
    @keyframes trace-border {
      from {
        stroke-dashoffset: 1.01;
      }
      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes fill-in {
      from {
        fill-opacity: 0;
      }
      to {
        fill-opacity: 1;
      }
    }

    .wordmark {
      fill-opacity: 0;
      animation: fill-in 0.083333s linear 1.5s both;
    }

    .border {
      fill: none;
      stroke-dasharray: 1.01;
      stroke-dashoffset: 1.01;
      stroke-linecap: butt;
      stroke-linejoin: round;
      animation: trace-border 0.333333s ease-in both;
    }

    .border-1 { animation-delay: 0s; }
    .border-2 { animation-delay: 0.166667s; }
    .border-3 { animation-delay: 0.333333s; }
    .border-4 { animation-delay: 0.5s; }
    .border-5 { animation-delay: 0.666667s; }
    .border-6 { animation-delay: 0.833333s; }
    .border-7 { animation-delay: 1s; }
    .border-8 { animation-delay: 1.166667s; }

    @media (prefers-reduced-motion: reduce) {
      .wordmark {
        animation: none;
        fill-opacity: 1;
      }

      .border {
        animation: none;
        stroke-dashoffset: 0;
      }
    }
  </style>

